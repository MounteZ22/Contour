[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contour"
version = "0.1.0"
description = "Lightweight context infrastructure for research collaboration with external AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1.0",
  "pydantic>=2.0.0",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.0",
  "rich>=14.0.0",
  "typer>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[project.scripts]
contour = "contour.cli:main"

[tool.setuptools]
packages = ["contour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
